name: One-time approved Sürüm 01 package

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/package-approved-once.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7

      - name: Sürüm 01 ZIP ve SHA-256 oluştur
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          relay_url = "https://firsat-kontrol-market-relay.onrender.com"
          root = Path(".")
          dist = root / "dist"
          dist.mkdir(exist_ok=True)
          archive_path = dist / "Firsat-Kontrol-Paneli-Surum-01.zip"
          excluded_dirs = {".git", ".github", ".venv", "venv", "__pycache__", "dist", "data", "logs", "reports", "run", "tests", "cloudflare_worker", "render_relay"}
          with ZipFile(archive_path, "w", compression=ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob("*")):
                  if not path.is_file():
                      continue
                  relative = path.relative_to(root)
                  if any(part in excluded_dirs for part in relative.parts):
                      continue
                  if path.suffix.lower() in {".zip", ".pyc", ".sha256"}:
                      continue
                  if relative.as_posix() == "market_data_relay.json":
                      relay_config = json.loads(path.read_text(encoding="utf-8"))
                      relay_config["url"] = relay_url
                      archive.writestr(relative.as_posix(), json.dumps(relay_config, ensure_ascii=False, indent=2) + "\n")
                  else:
                      archive.write(path, relative.as_posix())

          with ZipFile(archive_path) as archive:
              bad_member = archive.testzip()
              if bad_member is not None:
                  raise SystemExit(f"ZIP bütünlük kontrolü başarısız: {bad_member}")
              names = archive.namelist()
              for required in ("btcturk_usdt_spot.json", "market_data_relay.json", "BASLAT.bat"):
                  if required not in names:
                      raise SystemExit(f"Gerekli dosya pakette yok: {required}")
              relay_member = json.loads(archive.read("market_data_relay.json").decode("utf-8"))
              if relay_member.get("url") != relay_url:
                  raise SystemExit("Bulut geçidi URL'si ZIP ayarına yazılamadı.")
              if any(name.endswith(".zip") for name in names):
                  raise SystemExit("ZIP içinde iç içe ZIP dosyası bulundu.")

          digest = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          checksum_path = archive_path.with_suffix(archive_path.suffix + ".sha256")
          checksum_path.write_text(f"{digest}  {archive_path.name}\n", encoding="ascii")
          print(f"ZIP={archive_path}")
          print(f"SHA256={digest}")
          print(f"FILE_COUNT={len(names)}")
          print(f"ZIP_BYTES={archive_path.stat().st_size}")
          PY

      - name: Sürüm 01 Release varlıklarını yayımla
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python -m pip install --quiet "requests>=2.31.0,<3.0"
          python - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import quote
          import requests

          owner, repo = os.environ["GITHUB_REPOSITORY"].split("/", 1)
          api = f"https://api.github.com/repos/{owner}/{repo}"
          headers = {
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          session = requests.Session()
          session.headers.update(headers)
          response = session.get(f"{api}/releases/tags/surum-01", timeout=20)
          if response.status_code == 404:
              response = session.post(
                  f"{api}/releases",
                  json={
                      "tag_name": "surum-01",
                      "target_commitish": os.environ["GITHUB_SHA"],
                      "name": "Fırsat Kontrol Paneli — Sürüm 01",
                      "body": "Windows deneme paketi. ZIP, main dalındaki doğrulanmış kaynaklardan oluşturulmuştur. Program hesap bağlantısı kurmaz ve alım-satım emri göndermez.",
                      "draft": False,
                      "prerelease": False,
                      "generate_release_notes": False,
                  },
                  timeout=30,
              )
              if response.status_code not in (200, 201):
                  raise SystemExit(f"GitHub Release oluşturulamadı: HTTP {response.status_code} {response.text[:1000]}")
              release = response.json()
          elif response.status_code == 200:
              release = response.json()
          else:
              raise SystemExit(f"Release sorgulanamadı: HTTP {response.status_code} {response.text[:1000]}")

          replace_names = {"Firsat-Kontrol-Paneli-Surum-01.zip", "Firsat-Kontrol-Paneli-Surum-01.zip.sha256"}
          assets_response = session.get(f"{api}/releases/{release['id']}/assets", timeout=20)
          assets_response.raise_for_status()
          for asset in assets_response.json():
              if asset.get("name") in replace_names:
                  deleted = session.delete(f"{api}/releases/assets/{asset['id']}", timeout=20)
                  if deleted.status_code not in (200, 204, 404):
                      raise SystemExit(f"Eski varlık silinemedi: {asset['name']} HTTP {deleted.status_code}")

          upload_base = release["upload_url"].split("{", 1)[0]
          for path, content_type in (
              (Path("dist/Firsat-Kontrol-Paneli-Surum-01.zip"), "application/zip"),
              (Path("dist/Firsat-Kontrol-Paneli-Surum-01.zip.sha256"), "text/plain"),
          ):
              with path.open("rb") as stream:
                  uploaded = requests.post(
                      f"{upload_base}?name={quote(path.name)}",
                      headers={**headers, "Content-Type": content_type},
                      data=stream,
                      timeout=90,
                  )
              if uploaded.status_code not in (200, 201):
                  raise SystemExit(f"Release dosyası yüklenemedi: {path.name} HTTP {uploaded.status_code} {uploaded.text[:1000]}")
              print(f"RELEASE_ASSET_OK={path.name}", flush=True)
              print(f"RELEASE_ASSET_URL={uploaded.json().get('browser_download_url')}", flush=True)
          print(f"RELEASE_PAGE={release['html_url']}", flush=True)
          PY

      - name: ZIP dosyasını Actions artefaktı olarak da sakla
        uses: actions/upload-artifact@v7
        with:
          name: Firsat-Kontrol-Paneli-Surum-01-approved
          path: |
            dist/Firsat-Kontrol-Paneli-Surum-01.zip
            dist/Firsat-Kontrol-Paneli-Surum-01.zip.sha256
          if-no-files-found: error
          retention-days: 14
